services:
  db:
    image: timescale/timescaledb:latest-pg16
    # No host port — only reachable via Docker network (fixes SECURITY.md #2)
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warren}
      POSTGRES_USER: ${POSTGRES_USER:-warren}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warren}
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-warren} -d ${POSTGRES_DB:-warren}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port — only reachable via Docker network (fixes SECURITY.md #3)
    volumes:
      - ${REDIS_DATA_DIR:-./data/redis}:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"  # Localhost only — not exposed to LAN (fixes SECURITY.md #5)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
    environment:
      - TZ=Europe/Helsinki
      - LLM_PROVIDER=${LLM_PROVIDER:-claude_cli}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - CLAUDE_CLI_MODEL=${CLAUDE_CLI_MODEL:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.160:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
    networks: [ default, signal ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"  # Traefik routes here via 172.17.0.1 — cannot remove without shared Docker network
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=
      - API_KEY=${API_KEY:-}
    restart: unless-stopped

  # Scheduled pipeline runs using APScheduler
  cron:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - TZ=Europe/Helsinki
    command: ["python", "cron_scheduler.py"]
    restart: unless-stopped

  # AI Analyst Swarm — runs 9 analysts + portfolio manager on schedule
  # Configure via analyst-swarm/config.local.yaml or env vars
  analyst-swarm:
    build: ./analyst-swarm
    depends_on:
      backend:
        condition: service_started
    environment:
      - TZ=Europe/Helsinki
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-claude_cli}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://192.168.1.160:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:26b}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-}
      - BACKEND_URL=http://backend:8000/api/v1
      - API_KEY=${API_KEY:-}
      - MAX_PARALLEL=${MAX_PARALLEL:-1}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-signal}
      - SIGNAL_NOTIFY_URL=${SIGNAL_NOTIFY_URL:-http://signal-gateway-notify:8090/notify}
      - SIGNAL_NOTIFY_TOKEN=${SIGNAL_NOTIFY_TOKEN:-}
    networks: [ default, signal ]
    volumes:
      - ./.claude/agents:/app/agents:ro
      - ./analyst-swarm/config.local.yaml:/app/config.local.yaml:ro
      # Mount Claude auth for claude_cli provider (company subscription)
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
    restart: unless-stopped

  # One-shot registration: tells the local signal-gateway router that
  # incoming Signal messages prefixed with SIGNAL_PREFIX (default `bv`)
  # should be POSTed to bloomvalley's /signal-webhook. Retries until the
  # backend and signal-gateway router are both up. Exits on success;
  # restart: on-failure relaunches on transient errors.
  signal-register:
    image: curlimages/curl
    restart: on-failure
    networks: [ signal ]
    depends_on:
      backend:
        condition: service_started
    environment:
      - NOTIFICATION_PROVIDER=${NOTIFICATION_PROVIDER:-signal}
      - SIGNAL_ROUTER_TOKEN=${SIGNAL_ROUTER_TOKEN:-}
      - SIGNAL_PREFIX=${SIGNAL_PREFIX:-bv}
      - API_KEY=${API_KEY:-}
    command:
      - sh
      - -c
      - |
        if [ "$$NOTIFICATION_PROVIDER" != "signal" ]; then
          echo "signal-register: NOTIFICATION_PROVIDER=$$NOTIFICATION_PROVIDER, nothing to do"; exit 0;
        fi
        if [ -z "$$SIGNAL_ROUTER_TOKEN" ] || [ -z "$$API_KEY" ]; then
          echo "signal-register: missing SIGNAL_ROUTER_TOKEN or API_KEY — skipping"; exit 0;
        fi
        until curl -sf \
                -H "X-Token: $$SIGNAL_ROUTER_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"prefix\":\"$$SIGNAL_PREFIX\",\"webhook\":\"http://backend:8000/api/v1/notifications/signal-webhook\",\"auth_header\":{\"name\":\"X-API-Key\",\"value\":\"$$API_KEY\"},\"timeout_seconds\":300}" \
                http://signal-gateway-router:8091/register
        do
          echo "signal-register: router not ready yet, retrying..."
          sleep 5
        done
        echo "signal-register: registered prefix '$$SIGNAL_PREFIX'"

networks:
  default:
  # Joined as external: signal-gateway creates and owns it. Bring
  # signal-gateway up first (it publishes the network) before this stack.
  signal:
    external: true
